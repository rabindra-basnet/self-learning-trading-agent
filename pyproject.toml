[project]
name = "trading-agent-app"
version = "0.1.0"
description = "Self-improving AI trading agent — VSA modular monolith, Ports & Adapters"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "clickhouse-connect[async]>=0.8",
  "redis>=5.2",
  "ccxt>=4.4",
  "pandas>=2.2",
  "numpy>=2.0",
  "httpx>=0.28",
  "PyJWT>=2.10",
  "python-dotenv>=1.0",
  "magic-di[fastapi]>=0.3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.14",
  "hypothesis>=6.119",
  "vcrpy>=7.0",
  "respx>=0.21",
  "testcontainers[postgres,clickhouse,redis]>=4.8",
  "mypy>=1.13",
  "ruff>=0.8",
  "import-linter>=2.0",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m unit -q --tb=short"
markers = [
  "unit: pure domain/application tests (fast, no IO)",
  "integration: real containers + provider cassettes (testcontainers/vcrpy)",
  "e2e: full stack via in-memory/embedded adapters or deployed env",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
plugins = ["pydantic.mypy"]
exclude = ["app/infrastructure/providers/strategies/library.py"]

[[tool.mypy.overrides]]
module = [
  "ccxt.*",
  "clickhouse_connect.*",
  "structlog.*",
  "magic_di.*",
  "pandas.*",
  "vcrpy.*",
  "testcontainers.*",
  "pytest_mock.*",
  "hypothesis.*",
  "respx.*",
]
ignore_missing_imports = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core imports nothing from app"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["app.core"]
forbidden_modules = ["app.modules", "app.infrastructure", "app.api", "app.workers"]

[[tool.importlinter.contracts]]
name = "auth stays internal to its slice"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["app.modules.auth.domain", "app.modules.auth.application", "app.modules.auth.presentation"]
forbidden_modules = [
  "app.modules.marketdata.domain",
  "app.modules.marketdata.application",
  "app.modules.marketdata.presentation",
  "app.modules.marketdata.infrastructure",
  "app.modules.signals.domain",
  "app.modules.signals.application",
  "app.modules.signals.presentation",
  "app.modules.signals.infrastructure",
  "app.modules.strategies.domain",
  "app.modules.strategies.application",
  "app.modules.strategies.presentation",
  "app.modules.strategies.infrastructure",
  "app.modules.backtest.domain",
