services:
  panopticum:
    image: sharque/panopticum:latest
    container_name: trading-panopticum
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PANOPTICUM_USER: ${PANOPTICUM_USER}
      PANOPTICUM_PASSWORD: ${PANOPTICUM_PASSWORD}
      PANOPTICUM_CONNECTIONS_JSON: ${PANOPTICUM_CONNECTIONS_JSON}
    volumes:
      - panopticum_data:/data
    depends_on:
      - postgres
      - redis
      - clickhouse

  postgres:
    image: postgres:18
    container_name: trading-postgres
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: trading-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: trading-clickhouse
    environment:
      CLICKHOUSE_DB: trading
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: trading
    volumes:
      - clickhouse_data:/var/lib/clickhouse

volumes:
  panopticum_data:
  postgres_data:
  redis_data:
  clickhouse_data: